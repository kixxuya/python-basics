<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디어 디벨로퍼 - 대시보드</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .cursor-pointer { cursor: pointer; }
        .card:hover { transform: translateY(-3px); transition: 0.2s; box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
    </style>
</head>
<body>

    <!-- GNB (네비게이션 바) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">💡 아이디어 디벨로퍼</a>
            <div class="d-flex text-white align-items-center">
                <span class="me-3 cursor-pointer">🔔 알림</span>
                <span class="cursor-pointer">👤 홍길동 님</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 1. Hero Section -->
        <div class="p-5 text-center bg-white rounded-4 shadow-sm mb-5 border">
            <h1 class="mb-3 fw-bold text-dark">아이디어를 현실로 만들어보세요 🚀</h1>
            <p class="text-muted mb-4 fs-5">빈 문서에서 헤매지 마세요. AI 코치와 함께 체계적인 PRD를 작성해 보세요.</p>
            <button class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm" data-bs-toggle="modal" data-bs-target="#newPrdModal">
                + 새 PRD 프로젝트 시작하기
            </button>
        </div>

        <!-- 2. Middle Section (탭 메뉴) -->
        <ul class="nav nav-pills mb-4">
            <li class="nav-item">
                <a class="nav-link active rounded-pill px-4" href="#">내 프로젝트 (3)</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark px-4" href="#">공유받은 문서 (1)</a>
            </li>
        </ul>

        <!-- 3. Bottom Section (프로젝트 카드 그리드) -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            
            <!-- 카드 1 -->
            <div class="col">
                <div class="card h-100 shadow-sm border-0 cursor-pointer p-2 rounded-4">
                    <div class="card-body">
                        <span class="badge bg-primary bg-opacity-10 text-primary mb-3 px-3 py-2 rounded-pill">신규 기획</span>
                        <h5 class="card-title fw-bold mb-3">당근마켓 동네생활 모임 기능 PRD</h5>
                        <p class="card-text text-muted small mb-4">최근 수정: 오늘 오전 10:30</p>
                        
                        <!-- 완성도 프로그레스 바 -->
                        <div>
                            <div class="d-flex justify-content-between small mb-2 fw-bold text-secondary">
                                <span>문서 완성도</span>
                                <span>75%</span>
                            </div>
                            <div class="progress rounded-pill" style="height: 8px;">
                                <div class="progress-bar bg-success" role="progressbar" style="width: 75%;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 text-end pb-3">
                        <button class="btn btn-outline-primary btn-sm rounded-pill px-4">이어서 작성하기 &rarr;</button>
                    </div>
                </div>
            </div>

            <!-- 카드 2 -->
            <div class="col">
                <div class="card h-100 shadow-sm border-0 cursor-pointer p-2 rounded-4">
                    <div class="card-body">
                        <span class="badge bg-warning bg-opacity-10 text-warning mb-3 px-3 py-2 rounded-pill">기존 기능 개선</span>
                        <h5 class="card-title fw-bold mb-3">결제 퍼널 전환율 개선 PRD</h5>
                        <p class="card-text text-muted small mb-4">최근 수정: 어제 오후 2:15</p>
                        
                        <div>
                            <div class="d-flex justify-content-between small mb-2 fw-bold text-secondary">
                                <span>문서 완성도</span>
                                <span>30%</span>
                            </div>
                            <div class="progress rounded-pill" style="height: 8px;">
                                <div class="progress-bar bg-warning" role="progressbar" style="width: 30%;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-0 text-end pb-3">
                        <button class="btn btn-outline-primary btn-sm rounded-pill px-4">이어서 작성하기 &rarr;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 시작 유형 선택 모달 -->
    <div class="modal fade" id="newPrdModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold fs-4 ms-2 mt-2">어떤 프로젝트를 시작할까요?</h5>
                    <button type="button" class="btn-close me-2 mt-2" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <button class="btn btn-outline-secondary w-100 text-start p-4 mb-3 rounded-4 shadow-sm">
                        <h5 class="fw-bold text-dark mb-1">✨ 신규 프로젝트</h5>
                        <span class="text-muted small">완전히 새로운 제품이나 서비스의 PRD를 작성합니다.</span>
                    </button>
                    <button class="btn btn-outline-secondary w-100 text-start p-4 mb-3 rounded-4 shadow-sm">
                        <h5 class="fw-bold text-dark mb-1">🧩 기존 프로젝트의 신규 기능</h5>
                        <span class="text-muted small">기존 제품에 새로운 기능을 추가하기 위한 PRD입니다.</span>
                    </button>
                    <button class="btn btn-outline-secondary w-100 text-start p-4 rounded-4 shadow-sm">
                        <h5 class="fw-bold text-dark mb-1">🛠️ 개선 프로젝트</h5>
                        <span class="text-muted small">기존 문제점을 해결하고 개선하기 위한 PRD입니다.</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
